<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAP FITNESS · Hybrid Athletic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#121317;
  --surface:#1b1c22;
  --surface-2:#232430;
  --border:#31323e;
  --text:#ece9e4;
  --text-dim:#8b8d99;
  --text-faint:#54555f;
  --accent:#e8b923;
  --accent-dim:#8a6f1c;
  --blue:#4f83a1;
  --red:#c1533f;
  --green:#5e9c6e;
  --radius:10px;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

.app{
  max-width:640px;
  margin:0 auto;
  padding:20px 16px 180px;
}

header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:16px;
  flex-wrap:wrap;
  gap:10px;
}

.brand{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.brand span{color:var(--accent);}

.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

#logDate{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding:9px 10px;
  border-radius:8px;
  color-scheme:dark;
}

.icon-btn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:9px 10px;
  border-radius:8px;
  cursor:pointer;
}
.icon-btn:hover{color:var(--text);border-color:var(--text-dim);}

/* --- Top panels: bodyweight + consistency --- */
.panel-row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.panel{
  flex:1;
  min-width:240px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
}
.panel-title{
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:8px;
}
.bw-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bw-row input{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding:9px 8px;
  border-radius:7px;
  width:80px;
  text-align:center;
}
.bw-log-btn{
  background:var(--blue);
  color:#0d1a20;
  border:none;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:11.5px;
  letter-spacing:.4px;
  text-transform:uppercase;
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
}
.bw-stat{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-dim);
}
.bw-stat b{color:var(--text);}
.trend-up{color:var(--green);}
.trend-down{color:var(--red);}

.heatmap{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.hm-cell{
  aspect-ratio:1;
  border-radius:4px;
  background:var(--surface-2);
  border:1px solid var(--border);
}
.hm-cell.trained{background:var(--accent);border-color:var(--accent);}
.heatmap-caption{
  font-size:11px;
  color:var(--text-faint);
  margin-top:6px;
  font-family:'JetBrains Mono',monospace;
}

/* --- Recovery check --- */
.recovery-panel{
  margin-bottom:18px;
}
.rc-stats{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--text-dim);
  margin-bottom:10px;
}
.rc-stats b{color:var(--text);}
.rc-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.rc-item{
  font-size:12.5px;
  line-height:1.5;
  padding:8px 10px;
  border-radius:7px;
  border:1px solid var(--border);
  color:var(--text-dim);
}
.rc-item b{color:var(--text);}
.rc-item.alert{border-color:var(--red);background:rgba(193,83,63,0.09);color:var(--text);}
.rc-item.warn{border-color:var(--accent-dim);background:rgba(232,185,35,0.07);}
.rc-item.ok{border-color:var(--green);background:rgba(94,156,110,0.09);}
.rc-item.info{border-color:var(--blue);background:rgba(79,131,161,0.10);}
.rc-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* --- Day tabs --- */
.day-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:6px;
  margin-bottom:18px;
}
.day-tab{
  flex:0 0 auto;
  width:104px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:10px 8px;
  text-align:center;
  cursor:pointer;
  transition:border-color .15s, background .15s;
}
.day-tab .plate{
  width:34px;height:34px;
  margin:0 auto 6px;
  border-radius:50%;
  border:3px solid var(--text-faint);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;
  font-size:13px;
  font-weight:600;
  color:var(--text-dim);
}
.day-tab .dname{
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--text-dim);
}
.day-tab .dtitle{
  font-size:9.5px;
  color:var(--text-faint);
  margin-top:2px;
  line-height:1.2;
}
.day-tab .dsets{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;
  color:var(--text-faint);
  margin-top:4px;
}
.day-tab.active{border-color:var(--accent);background:var(--surface-2);}
.day-tab.active .plate{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(232,185,35,0.12);}
.day-tab.active .dname{color:var(--text);}

/* --- Sticky day heading + progress --- */
.day-heading-wrap{
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:5;
  padding-top:2px;
  padding-bottom:10px;
  margin-bottom:8px;
  border-bottom:1px solid var(--border);
}
.day-heading{
  font-family:'Oswald',sans-serif;
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.day-heading b{color:var(--accent);font-weight:600;}
.progress-wrap{display:flex;flex-direction:column;gap:4px;}
.progress-track{
  height:8px;
  background:var(--surface-2);
  border-radius:5px;
  overflow:hidden;
  border:1px solid var(--border);
}
.progress-fill{
  height:100%;
  background:var(--accent);
  width:0%;
  transition:width .2s;
}
.progress-stats{
  display:flex;
  justify-content:space-between;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
}

/* --- Day note --- */
.day-note{
  font-size:12.5px;
  line-height:1.55;
  color:var(--text-dim);
  background:rgba(232,185,35,0.06);
  border:1px solid var(--accent-dim);
  border-radius:var(--radius);
  padding:10px 12px;
  margin-bottom:10px;
}
.day-note b{color:var(--text);}
.day-note.deload{border-color:var(--blue);background:rgba(79,131,161,0.10);}

/* --- Exercise cards --- */
.exercise{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 14px 12px;
  margin-bottom:10px;
}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;cursor:pointer;}
.ex-name-row{display:flex;align-items:center;gap:9px;}
.ex-check{
  width:24px;height:24px;
  border-radius:6px;
  border:2px solid var(--text-faint);
  cursor:pointer;
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s, background .15s;
}
.ex-check.done{background:var(--green);border-color:var(--green);}
.ex-check.done::after{content:'✓';color:#0d0e10;font-size:14px;font-weight:700;}
.ex-name{font-size:14.5px;font-weight:500;}
.warn-dot{color:var(--accent);font-size:12px;margin-left:2px;}
.ex-target{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--blue);
  background:rgba(79,131,161,0.12);
  padding:3px 7px;
  border-radius:6px;
  white-space:nowrap;
}
.ex-expand-icon{
  font-size:11px;
  color:var(--text-faint);
  margin-left:4px;
  transition:transform .15s;
}
.exercise.expanded .ex-expand-icon{transform:rotate(180deg);}

.ex-last{
  font-size:11.5px;
  color:var(--text-faint);
  font-family:'JetBrains Mono',monospace;
  margin:6px 0 6px 33px;
  min-height:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.pr-badge{
  font-size:10px;
  color:#1a1503;
  background:var(--accent);
  padding:2px 6px;
  border-radius:5px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:.3px;
  margin-left:4px;
}
.chart-toggle{
  background:none;
  border:none;
  color:var(--text-faint);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  cursor:pointer;
  text-decoration:underline;
  white-space:nowrap;
}
.chart-toggle:hover{color:var(--text-dim);}

/* collapsible detail block */
.ex-detail{display:none;margin-left:33px;}
.exercise.expanded .ex-detail{display:block;}

.ex-actions-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.info-btn{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--accent);
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:11px;
  letter-spacing:.4px;
  text-transform:uppercase;
  padding:7px 11px;
  border-radius:7px;
  cursor:pointer;
}
.info-btn:hover{border-color:var(--accent);}

.ex-build{
  font-size:11.5px;
  line-height:1.55;
  color:var(--text-dim);
  border-left:3px solid var(--accent);
  background:rgba(232,185,35,0.05);
  padding:7px 10px;
  border-radius:0 7px 7px 0;
  margin-bottom:10px;
}

.ex-suggestion{
  font-size:11.5px;
  line-height:1.7;
  color:var(--text-dim);
  background:rgba(232,185,35,0.07);
  border:1px solid var(--accent-dim);
  padding:8px 10px;
  border-radius:7px;
  margin-bottom:10px;
  font-family:'JetBrains Mono',monospace;
}

.ex-metrics{
  display:flex;
  gap:14px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  margin:8px 0 4px;
  flex-wrap:wrap;
}
.ex-metrics b{color:var(--text-dim);}

.chart-area{margin:8px 0 10px;display:none;}
.chart-area.open{display:block;}
.chart-area svg{width:100%;height:70px;display:block;}
.hist-table{width:100%;border-collapse:collapse;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10.5px;}
.hist-table th, .hist-table td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--border);color:var(--text-dim);}
.hist-table th{color:var(--text-faint);font-weight:500;text-transform:uppercase;font-size:9.5px;letter-spacing:.4px;}
.hist-table td.num{text-align:right;}

.sets-grid{display:flex;flex-direction:column;gap:8px;}
.set-row{display:flex;align-items:center;gap:6px;transition:background .15s;border-radius:8px;}
.set-row.completed{background:rgba(94,156,110,0.10);}
.set-idx{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);width:14px;}
.set-row input{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  padding:9px 8px;
  border-radius:7px;
  text-align:center;
}
.set-row .w-input, .set-row .sec-input{width:66px;}
.set-row .r-input{width:58px;}
.set-row input::placeholder{color:var(--text-faint);}
.set-row input:focus{outline:none;border-color:var(--accent);}
.set-x{color:var(--text-faint);font-size:12px;}
.set-done-btn{
  width:28px;height:28px;
  border-radius:50%;
  border:2px solid var(--text-faint);
  background:none;
  color:var(--text-faint);
  cursor:pointer;
  font-size:13px;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.set-row.completed .set-done-btn{border-color:var(--green);color:var(--green);}
.row-remove{
  background:none;border:none;color:var(--text-faint);
  cursor:pointer;font-size:17px;padding:0 6px;margin-left:auto;
}
.row-remove:hover{color:var(--red);}
.add-set-btn{
  margin-top:6px;
  background:none;
  border:1px dashed var(--border);
  color:var(--text-faint);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:8px 10px;
  border-radius:7px;
  cursor:pointer;
  width:fit-content;
}
.add-set-btn:hover{color:var(--text-dim);border-color:var(--text-dim);}

/* --- Rest timer bar --- */
.rest-bar{
  position:fixed;
  left:0;right:0;
  bottom:78px;
  display:flex;
  justify-content:center;
  z-index:20;
}
.rest-inner{
  max-width:600px;width:calc(100% - 32px);
  background:var(--surface-2);
  border:1px solid var(--accent-dim);
  border-radius:12px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
}
.rest-label{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rest-time{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--accent);}
.rest-controls{display:flex;gap:6px;}
.rest-controls button{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:'Oswald',sans-serif;
  font-size:10.5px;
  letter-spacing:.3px;
  text-transform:uppercase;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
}
.rest-controls button:hover{color:var(--text);}

/* --- Save bar --- */
.save-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(to top, var(--bg) 70%, transparent);
  padding:18px 16px 20px;
  display:flex;justify-content:center;
  z-index:15;
}
.save-inner{max-width:640px;width:100%;display:flex;align-items:center;gap:12px;}
#saveBtn{
  flex:1;background:var(--accent);color:#1a1503;border:none;
  font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;font-size:14px;padding:15px;border-radius:9px;cursor:pointer;
  transition:transform .1s, background .15s;
}
#saveBtn:active{transform:scale(0.98);}
#saveBtn:disabled{background:var(--text-faint);cursor:default;}
#saveStatus{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);min-width:80px;text-align:right;}

/* --- Modals --- */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  z-index:50;
  align-items:flex-end;
  justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px 16px 0 0;
  max-width:640px;width:100%;
  max-height:85vh;
  overflow-y:auto;
  padding:20px 18px 26px;
}
@media (min-width:520px){
  .modal-overlay{align-items:center;}
  .modal-box{border-radius:16px;margin:16px;}
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.modal-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.modal-close{background:none;border:none;color:var(--text-faint);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--text);}
.info-section{margin-bottom:14px;}
.info-label{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:5px;}
.info-text{font-size:13.5px;line-height:1.5;color:var(--text-dim);}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:var(--surface-2);border:1px solid var(--border);padding:4px 9px;border-radius:6px;font-size:12px;color:var(--text-dim);}
.bullet-list{list-style:none;}
.bullet-list li{font-size:13.5px;color:var(--text-dim);line-height:1.5;padding-left:16px;position:relative;margin-bottom:4px;}
.bullet-list li::before{content:'—';position:absolute;left:0;color:var(--text-faint);}
.mistake-list li::before{content:'✕';color:var(--red);}
.safety-box{background:rgba(193,83,63,0.08);border:1px solid var(--red);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text-dim);margin-top:6px;}
.build-box{background:rgba(232,185,35,0.07);border:1px solid var(--accent-dim);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--text-dim);margin-top:6px;}
.build-box b{color:var(--text);}

/* completion modal */
.completion-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.completion-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.completion-stat .val{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;color:var(--accent);}
.completion-stat .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);text-transform:uppercase;margin-top:3px;}
.completion-next{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-dim);
  border-top:1px solid var(--border);
  padding-top:12px;
  margin-top:6px;
}
.modal-ok-btn{
  margin-top:16px;width:100%;
  background:var(--accent);color:#1a1503;border:none;
  font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;font-size:13.5px;padding:13px;border-radius:9px;cursor:pointer;
}

@media (max-width:420px){
  .brand{font-size:22px;}
  .day-tab{width:92px;}
  .panel{min-width:100%;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">SWAP <span>FITNESS</span></div>
    <div class="header-right">
      <input type="date" id="logDate">
      <button class="icon-btn" id="guideBtn">Build notes</button>
      <button class="icon-btn" id="exportBtn">Export CSV</button>
    </div>
  </header>

  <div class="panel-row">
    <div class="panel">
      <div class="panel-title">Body Weight &amp; Waist</div>
      <div class="bw-row">
        <input type="number" inputmode="decimal" step="0.1" id="bwInput" placeholder="kg">
        <button class="bw-log-btn" id="bwLogBtn">Log</button>
        <span class="bw-stat" id="bwStat"></span>
      </div>
      <div class="bw-row">
        <input type="number" inputmode="decimal" step="0.1" id="waistInput" placeholder="cm">
        <button class="bw-log-btn" id="waistLogBtn">Log waist</button>
        <span class="bw-stat" id="waistStat"></span>
      </div>
      <div class="bw-stat" style="margin-bottom:8px;">Measure at the navel, relaxed, same time of day.</div>
      <div id="bwChart"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Last 28 Days</div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heatmap-caption" id="heatmapCaption"></div>
    </div>
  </div>

  <div class="panel recovery-panel" id="recoveryPanel">
    <div class="panel-title">Recovery Check</div>
    <div class="rc-stats" id="rcStats"></div>
    <ul class="rc-list" id="rcList"></ul>
    <div class="rc-actions">
      <button class="icon-btn" id="deloadBtn">Start deload week</button>
    </div>
  </div>

  <nav class="day-tabs" id="dayTabs"></nav>

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z'))/86400000);
}
function defaultDayFromWeekday(){

const STORAGE_PREFIX = 'ironlog_';

async function safeGet(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('storage get failed', key, e); return null; }
}
async function safeSet(key, val){
  try{ localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val)); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function safeList(prefix){
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(STORAGE_PREFIX + prefix)) keys.push(k.slice(STORAGE_PREFIX.length));
    }
    return keys;
  }catch(e){ console.error('storage list failed', e); return []; }
}

/* ---------- Sparkline / chart builder ---------- */
function buildSparkline(points, unitLabel){
  if(!points.length) return '<div style="font-size:11px;color:var(--text-faint);font-family:JetBrains Mono,monospace;">No data yet</div>';
  const w = 280, h = 64, padX = 6, padY = 10;
  const vals = points.map(p=>p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const stepX = points.length>1 ? (w - padX*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = padX + i*stepX;
    const y = h - padY - ((p.value-min)/range)*(h-padY*2);
    return {x,y,...p};
  });
  const path = coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="var(--accent)"><title>${c.date}: ${c.value}${unitLabel}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}
  </svg>
  <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-faint);margin-top:2px;">
    <span>${min}${unitLabel}</span><span>${max}${unitLabel}</span>
  </div>`;
}

function buildHistoryTable(hist, type){
  const rows = hist.slice(-8).reverse();
  if(!rows.length) return '';
  let head, body;
  if(type==='time'){
    head = '<tr><th>Date</th><th>Best</th></tr>';
    body = rows.map(h=>{
      const best = Math.max(0,...h.sets.map(s=>s.sec||0));
      return `<tr><td>${h.date}</td><td class="num">${best}s</td></tr>`;
    }).join('');
  } else {
    head = '<tr><th>Date</th><th>Top Set</th><th>Volume</th></tr>';
    body = rows.map(h=>{
      const topSet = h.sets.reduce((best,s)=> (s.w||0) > (best.w||0) ? s : best, {w:0,r:0});
      const vol = computeVolume(h);
      return `<tr><td>${h.date}</td><td class="num">${topSet.w||0}×${topSet.r||0}</td><td class="num">${Math.round(vol)}kg</td></tr>`;
    }).join('');
  }
  return `<table class="hist-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

/* ---------- Bodyweight panel ---------- */
async function renderBodyweight(){
  const log = (await safeGet('bodyweight_log')) || [];
  const stat = document.getElementById('bwStat');
  if(log.length){
    const last = log[log.length-1];
    let trendHtml = '';
    if(log.length>1){
      const prev = log[log.length-2];
      const diff = (last.weight - prev.weight);
      const cls = diff<0 ? 'trend-down' : (diff>0 ? 'trend-up' : '');
      const arrow = diff<0 ? '↓' : (diff>0 ? '↑' : '→');
      trendHtml = ` <span class="${cls}">${arrow} ${Math.abs(diff).toFixed(1)}</span>`;
    }
    stat.innerHTML = `<b>${last.weight}kg</b>${trendHtml}`;
  } else {
    stat.textContent = 'No entries yet';
  }
  const points = log.slice(-12).map(e=>({date:e.date, value:e.weight}));
  document.getElementById('bwChart').innerHTML = buildSparkline(points, 'kg');
}

async function logBodyweight(){
  const input = document.getElementById('bwInput');
  const val = input.value;
  if(val === '') return;
  const log = (await safeGet('bodyweight_log')) || [];
  const filtered = log.filter(e=>e.date !== currentDate);
  filtered.push({date: currentDate, weight: Number(val)});
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  await safeSet('bodyweight_log', filtered.slice(-90));
  input.value = '';
  renderBodyweight();
  renderRecovery();
}

  for(let i=27;i>=0;i--) dates.push(daysAgoISO(i));
  dates.forEach(d=>{
    const cell = document.createElement('div');
    cell.className = 'hm-cell' + (trained.has(d) ? ' trained' : '');
    cell.title = d;
    grid.appendChild(cell);
  });
  const count = dates.filter(d=>trained.has(d)).length;
  document.getElementById('heatmapCaption').textContent = `${count} of 28 days trained`;
}

/* ---------- Recovery check ---------- */
async function getDeloadState(){
  const ds = await safeGet('deload_start');
  const since = ds ? daysBetween(ds, todayISO()) : null;
  const active = since!==null && since>=0 && since<7;
  return {start: ds, since, active};
}

async function renderRecovery(){
  const trained = new Set((await safeGet('trained_dates')) || []);
  const today = todayISO();
  const sorted = Array.from(trained).sort();

  // Consecutive training days, counted back from today (or yesterday if today isn't trained yet)
  let streak = 0;
  let i = trained.has(today) ? 0 : 1;
  while(i<60 && trained.has(daysAgoISO(i))){ streak++; i++; }

  let last7 = 0;
  for(let k=0;k<7;k++) if(trained.has(daysAgoISO(k))) last7++;

  const dl = await getDeloadState();
  let weeksOn = 0;
  if(dl.start){ weeksOn = Math.max(0, Math.floor((dl.since-7)/7)); }
  else if(sorted.length){ weeksOn = Math.floor(daysBetween(sorted[0], today)/7); }

  const items = [];

  if(dl.active){
    items.push({lvl:'info', html:`<b>Deload week, day ${dl.since+1} of 7.</b> Do about half the usual sets, keep weights the same or drop them 10%, and stop 3+ reps short of failure. Sleep and eat as normal.`});
  } else if(weeksOn>=7){
    items.push({lvl:'alert', html:`<b>${weeksOn} weeks without a deload.</b> With this hybrid schedule, consider an easier week every 5–7 weeks or sooner if recovery drops. Take one now, even if you feel fine — fatigue hides behind motivation.`});
  } else if(weeksOn>=5){
    items.push({lvl:'warn', html:`<b>Week ${weeksOn+1} since your last deload.</b> A deload is due this week or next.`});
  }

  if(streak>=5){
    items.push({lvl:'alert', html:`<b>${streak} training days in a row.</b> Take a rest day before the next session. Lifting heavy without a break is how tendons and the lower back get overloaded.`});
  } else if(streak===4){
    items.push({lvl:'warn', html:`<b>4 days in a row.</b> Your next day should be a rest day.`});
  }

  if(last7>=6){
    items.push({lvl:'alert', html:`<b>${last7} sessions in the last 7 days.</b> The planned week has four strength/athletic sessions and one conditioning session; extra hard sessions may compromise recovery.`});
  }

  const dow = new Date().getDay();
  if(REST_DAYS.includes(dow) && !trained.has(today)){
    items.push({lvl:'info', html:`<b>Planned rest day.</b> Optional: a 20–30 minute easy walk or cycle, some mobility work and a proper meal. Keep it easy; no hard boxing or intervals today.`});
  }

  // Body-weight trend over the last 3 weeks
  const bw = (await safeGet('bodyweight_log')) || [];
  const recent = bw.filter(e=>{ const d = daysBetween(e.date, today); return d>=0 && d<=21; });
  if(recent.length>=2){
    const first = recent[0], last = recent[recent.length-1];
    const span = daysBetween(first.date, last.date);
    if(span>=10){
      const rate = (last.weight - first.weight)/(span/7);
      if(rate>0.3){
        items.push({lvl:'warn', html:`<b>Gaining about ${rate.toFixed(2)} kg/week.</b> Faster than needed for this goal. If it continues past the first 2–3 weeks at maintenance, cut 150–200 kcal/day instead of adding training.`});
      } else if(rate<-0.4){
        items.push({lvl:'warn', html:`<b>Losing about ${Math.abs(rate).toFixed(2)} kg/week.</b> Faster than the 0.25–0.5 kg/week target. If lifts are stalling or recovery is poor, add 150–250 kcal, carbs around training first.`});
      }
    }
  }

  // Waist trend over the last 4 weeks (needs at least 2 weeks of data)
  const wl = (await safeGet('waist_log')) || [];
  const wrecent = wl.filter(e=>{ const d = daysBetween(e.date, today); return d>=0 && d<=28; });
  if(wrecent.length>=2){
    const wf = wrecent[0], wlast = wrecent[wrecent.length-1];
    if(daysBetween(wf.date, wlast.date)>=14){
      const dc = wlast.waist - wf.waist;
      if(dc>=1){
        items.push({lvl:'warn', html:`<b>Waist up ${dc.toFixed(1)} cm over the last few weeks.</b> If weight is also rising, trim 150–200 kcal/day. Keep protein around 1.8–2.2 g/kg.`});
      } else if(dc<=-1){
        items.push({lvl:'ok', html:`<b>Waist down ${Math.abs(dc).toFixed(1)} cm.</b> Trend is right. Keep strength numbers steady while it moves.`});
      }
    }
  }

  if(!items.length){
    items.push({lvl:'ok', html:`<b>No recovery flags.</b> Keep leaving 1–2 reps in reserve on compounds.`});
  }

  document.getElementById('rcStats').innerHTML = `
    <span>Streak <b>${streak}d</b></span>
    <span>Last 7 days <b>${last7}</b> sessions</span>
    <span>Since deload <b>${dl.active ? 'deloading now' : weeksOn+'w'}</b></span>`;
  document.getElementById('rcList').innerHTML = items.map(it=>`<li class="rc-item ${it.lvl}">${it.html}</li>`).join('');
  document.getElementById('deloadBtn').textContent = dl.active ? 'End deload week' : 'Start deload week today';
}

document.getElementById('deloadBtn').onclick = async ()=>{
  const dl = await getDeloadState();
  await safeSet('deload_start', dl.active ? null : todayISO());
  renderRecovery();
  renderDay();
};

/* ---------- Target parsing & suggestions ---------- */
function parseTarget(target){
  const str = String(target);
  const afterX = str.split(/[×x]/)[1] || str;
  const rangeMatch = afterX.match(/(\d+)\s*-\s*(\d+)/);
  if(rangeMatch) return {min:Number(rangeMatch[1]), max:Number(rangeMatch[2])};
  const singleMatch = afterX.match(/(\d+)/);
  if(singleMatch) return {min:Number(singleMatch[1]), max:Number(singleMatch[1])};
  return {min:null, max:null};
}

/* Double progression: the working weight stays fixed across all prescribed
   sets of an exercise for a given session. Reps are pushed up, set to set
   and session to session, within the prescribed rep range. Weight only goes
   up once every prescribed set hits the TOP of the rep range in the same
   session — never mid-session, never automatically every session.
   The size of the jump is per exercise (see INC). */
function computeSuggestion(exObj, lastEntry){
  if(!lastEntry || exObj.type!=='wr' || NO_SUGGEST.has(exObj.id)) return null;
  const {min,max} = parseTarget(exObj.target);
  if(min===null) return null;
  const validSets = lastEntry.sets.filter(s=>s.w!==undefined && s.r!==undefined);
  if(!validSets.length) return null;
  const topWeight = Math.max(...validSets.map(s=>s.w||0));
  if(topWeight===0){
    if(!BODYWEIGHT.has(exObj.id)) return null;
    const bwReps = validSets.map(s=>s.r||0);
    const bwStr = bwReps.join(',');
    const bwTotal = bwReps.reduce((a,b)=>a+b,0);
    const bwTop = bwReps.length>=exObj.sets && bwReps.every(r=>r>=max);
    if(bwTop){
      const inc = INC[exObj.id] !== undefined ? INC[exObj.id] : 1;
      return {suggestedWeight: undefined, increase:true, lines:[
        `Add load: start with +${inc} kg (belt or dumbbell) or a harder variation`,
        `Previous: ${bwStr}`,
        `You reached the top of the rep range on every set.`
      ]};
    }
    return {suggestedWeight: undefined, increase:false, lines:[
      `Bodyweight: add reps first`,
      `Previous: ${bwStr}`,
      `Goal: ${Array(exObj.sets).fill(max).join(',')}`,
      `Next target: beat ${bwTotal} total reps`
    ]};
  }

  const reps = validSets.map(s=>s.r||0);
  const repsStr = reps.join(',');
  const totalReps = reps.reduce((a,b)=>a+b,0);
  // Only count it as "top of range on every set" if every prescribed working
  // set was logged and each one reached (or passed) the top of the range.
  const hitTopEverySet = reps.length>=exObj.sets && reps.every(r=>r>=max);

  if(hitTopEverySet){
    const inc = INC[exObj.id] !== undefined ? INC[exObj.id] : 2.5;
    const suggestedWeight = Math.round((topWeight+inc)*2)/2;
    return {
      suggestedWeight,
      increase:true,
      lines:[
        `Increase to ${suggestedWeight} kg (+${inc})`,
        `Previous: ${repsStr}`,
        `You reached the top of the rep range on every set.`
      ]
    };
  }

  const goalStr = Array(exObj.sets).fill(max).join(',');
  return {
    suggestedWeight: topWeight,
    increase:false,
    lines:[
      `Keep ${topWeight} kg`,
      `Previous: ${repsStr}`,
      `Goal: ${goalStr}`,
      `Next target: beat ${totalReps} total reps`
    ]
  };
}

/* ---------- Volume / 1RM / PRs ---------- */
function computeVolume(entry){
  if(!entry) return 0;
  return entry.sets.reduce((sum,s)=> sum + ((s.w||0)*(s.r||0)), 0);
}
function compute1RM(entry){
  if(!entry) return null;
  let max = 0;
  entry.sets.forEach(s=>{
    if(s.w && s.r){ const e1 = s.w*(1+s.r/30); if(e1>max) max = e1; }
  });
  return max ? Math.round(max*10)/10 : null;
}
function detectPRs(hist, todayEntry, type){
  if(!todayEntry) return [];
  const prior = hist.filter(h=>h.date!==currentDate);
  const prs = [];
  if(type==='time'){
    const todayMax = Math.max(0,...todayEntry.sets.map(s=>s.sec||0));
    const priorMax = prior.length ? Math.max(0,...prior.flatMap(h=>h.sets.map(s=>s.sec||0))) : 0;
    if(todayMax>0 && todayMax>priorMax) prs.push('Duration PR');
    return prs;
  }
  const todayMaxW = Math.max(0,...todayEntry.sets.map(s=>s.w||0));
  const priorMaxW = prior.length ? Math.max(0,...prior.flatMap(h=>h.sets.map(s=>s.w||0))) : 0;
  if(todayMaxW===0){
    const todayMaxR = Math.max(0,...todayEntry.sets.map(s=>s.r||0));
    const priorMaxR = prior.length ? Math.max(0,...prior.flatMap(h=>h.sets.map(s=>s.r||0))) : 0;
    if(todayMaxR>0 && todayMaxR>priorMaxR) prs.push('Rep PR');
    return prs;
  }
  if(todayMaxW>0 && todayMaxW>priorMaxW) prs.push('Weight PR');
  const today1RM = compute1RM(todayEntry) || 0;
  const prior1RM = prior.length ? Math.max(0,...prior.map(h=>compute1RM(h)||0)) : 0;
  if(today1RM>0 && today1RM>prior1RM) prs.push('1RM PR');
  const todayVol = computeVolume(todayEntry);
  const priorVol = prior.length ? Math.max(0,...prior.map(h=>computeVolume(h))) : 0;
  if(todayVol>0 && todayVol>priorVol) prs.push('Volume PR');
  return prs;
}

function formatLast(entry){
  if(!entry) return 'No previous log';
  const parts = entry.sets.map(s=>{
    if(s.sec !== undefined) return `${s.sec}s`;
    return `${s.w||0}×${s.r||0}`;
  });
  return 'Last: ' + parts.join(' · ') + ` (${entry.date})`;
}

/* ---------- Rest timer ---------- */
let restState = { remaining:0, total:0, running:false, intervalId:null };
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function startRestTimer(seconds, label){
  clearInterval(restState.intervalId);
  restState.remaining = seconds;
  restState.total = seconds;
  restState.running = true;
  document.getElementById('restBar').style.display = 'flex';
  document.getElementById('restLabel').textContent = 'Rest — ' + label;
  document.getElementById('restTime').textContent = fmtTime(restState.remaining);
  document.getElementById('restPause').textContent = 'Pause';
  tickRestTimer();
}
function tickRestTimer(){
  restState.intervalId = setInterval(()=>{
    if(!restState.running) return;
    restState.remaining--;
    if(restState.remaining<=0){
      document.getElementById('restTime').textContent = 'DONE';
      clearInterval(restState.intervalId);
      setTimeout(()=>{ document.getElementById('restBar').style.display='none'; }, 2000);
      return;
    }
    document.getElementById('restTime').textContent = fmtTime(restState.remaining);
  }, 1000);
}
document.getElementById('restPause').onclick = ()=>{
  restState.running = !restState.running;
  document.getElementById('restPause').textContent = restState.running ? 'Pause' : 'Resume';
};
document.getElementById('restAdd30').onclick = ()=>{
  restState.remaining += 30;
  document.getElementById('restTime').textContent = fmtTime(restState.remaining);
};
document.getElementById('restSkip').onclick = ()=>{
  clearInterval(restState.intervalId);
  document.getElementById('restBar').style.display = 'none';
};

/* ---------- Set rows ---------- */
function buildSetRow(type, idx, savedSet, lastSet, suggestedWeight){
  const row = document.createElement('div');
  row.className = 'set-row';
  let inner = `<span class="set-idx">${idx+1}</span>`;
  if(type==='time'){
    const val = savedSet ? savedSet.sec : '';
    const ph = lastSet ? lastSet.sec : '60';
    inner += `<input type="number" inputmode="numeric" class="sec-input" placeholder="${ph}" value="${val}">
      <span class="set-x">sec</span>`;
  } else {
    const wVal = savedSet ? savedSet.w : '';
    const rVal = savedSet ? savedSet.r : '';
    const wPh = suggestedWeight !== undefined ? suggestedWeight : (lastSet ? lastSet.w : 'kg');
    const rPh = lastSet ? lastSet.r : 'reps';
    inner += `<input type="number" inputmode="decimal" step="0.5" class="w-input" placeholder="${wPh}" value="${wVal}">
      <span class="set-x">×</span>
      <input type="number" inputmode="numeric" class="r-input" placeholder="${rPh}" value="${rVal}">`;
  }
  inner += `<button type="button" class="set-done-btn" title="Mark set done / start rest">✓</button>`;
  inner += `<button type="button" class="row-remove" title="Remove set">×</button>`;
  row.innerHTML = inner;
  if(savedSet) row.classList.add('completed');
  row.querySelector('.row-remove').onclick = ()=>{ row.remove(); renderProgress(); };
  return row;
}

/* Working weight must stay identical across every prescribed set in an
   exercise. Typing a weight into any set fills the others automatically —
   but never overwrites a value the person already entered by hand, so
   manual overrides on individual sets are always possible. */
function wireWeightSync(setsGrid){
  setsGrid.querySelectorAll('.w-input').forEach(inp=>{
    if(inp.dataset.syncWired) return;
    inp.dataset.syncWired = '1';
    inp.addEventListener('input', ()=>{
      if(inp.value===''){
        // Clearing the first-touched weight doesn't clear siblings —
        // avoids surprising deletions elsewhere in the exercise.
        return;
      }
      setsGrid.querySelectorAll('.w-input').forEach(other=>{
        if(other!==inp && other.value===''){ other.value = inp.value; }
      });
      renderProgress();
    });
  });
}
function getSharedWorkingWeight(setsGrid){
  const filled = Array.from(setsGrid.querySelectorAll('.w-input')).find(i=>i.value!=='');
  return filled ? Number(filled.value) : undefined;
}

    // Working weight is fixed across all prescribed sets for the session,
    // so every set row shares the same suggested-weight placeholder.
    const sw = suggestion ? suggestion.suggestedWeight : undefined;
    for(let i=0;i<exObj.sets;i++){
      const savedSet = todayEntry && todayEntry.sets[i] ? todayEntry.sets[i] : null;
      const lastSet = lastEntry && lastEntry.sets[i] ? lastEntry.sets[i] : null;
      setsGrid.appendChild(buildSetRow(exObj.type, i, savedSet, lastSet, sw));
    }
    if(todayEntry && todayEntry.sets.length > exObj.sets){
      for(let i=exObj.sets;i<todayEntry.sets.length;i++){
        setsGrid.appendChild(buildSetRow(exObj.type, i, todayEntry.sets[i], null, sw));
      }
    }
    if(exObj.type==='wr') wireWeightSync(setsGrid);

    setsGrid.querySelectorAll('.set-done-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const row = btn.closest('.set-row');
        row.classList.add('completed');
        startRestTimer(exObj.rest, exObj.name);
        renderProgress();
        markSessionStart();
      };
    });

    card.querySelector('.add-set-btn').onclick = ()=>{
      const idx = setsGrid.children.length;
      // Extra sets added mid-session should default to whatever working
      // weight is already in use, not a blank field.
      const existingWeight = exObj.type==='wr' ? getSharedWorkingWeight(setsGrid) : undefined;
      const row = buildSetRow(exObj.type, idx, null, null, existingWeight!==undefined ? existingWeight : sw);
      setsGrid.appendChild(row);
      row.querySelector('.set-done-btn').onclick = ()=>{
        row.classList.add('completed');
        startRestTimer(exObj.rest, exObj.name);
        renderProgress();
        markSessionStart();
      };
      if(exObj.type==='wr') wireWeightSync(setsGrid);
    };

    const chartArea = card.querySelector('.chart-area');
    card.querySelector('.chart-toggle').onclick = (e)=>{
      e.stopPropagation();
      card.classList.add('expanded');
      const open = chartArea.classList.toggle('open');
      if(open){
        const points = hist.slice(-10).map(h=>({date:h.date, value: exObj.type==='time' ? Math.max(0,...h.sets.map(s=>s.sec||0)) : Math.max(0,...h.sets.map(s=>s.w||0))}));
        const unit = exObj.type==='time' ? 's' : 'kg';
        chartArea.innerHTML = buildSparkline(points, unit) + buildHistoryTable(hist, exObj.type);
      }
    };

    list.appendChild(card);
  }

  // update progress + set input listeners for suggestion prefill & progress bar
  list.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{ renderProgress(); markSessionStart(); });
  });
  renderProgress();
  updateSaveButtonLabel();
}

/* ---------- Progress bar ---------- */
function computeDayProgress(){
  const d = PLAN[currentDay];
  let totalSets = 0, filledSets = 0, doneEx = 0;
  document.querySelectorAll('.exercise').forEach(card=>{
    const exObj = d.exercises.find(e=>e.id===card.dataset.exId);
    if(!exObj) return;
    totalSets += exObj.sets;
    const rows = Array.from(card.querySelectorAll('.set-row')).slice(0, exObj.sets);
    rows.forEach(row=>{
      if(card.dataset.type==='time'){
        const v = row.querySelector('.sec-input').value;
        if(v!=='') filledSets++;
      } else {
        const w = row.querySelector('.w-input').value;
        const r = row.querySelector('.r-input').value;
        if(w!=='' || r!=='') filledSets++;
      }
    });
    if(card.querySelector('.ex-check').classList.contains('done')) doneEx++;
  });
  return {totalSets, filledSets, totalEx: d.exercises.length, doneEx};
}
function renderProgress(){
  const {totalSets, filledSets, totalEx, doneEx} = computeDayProgress();
  const pct = totalSets ? Math.round((filledSets/totalSets)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressExText').textContent = `${doneEx} / ${totalEx} exercises`;
  document.getElementById('progressSetText').textContent = `${filledSets} / ${totalSets} sets`;
  updateSaveButtonLabel();
}
function updateSaveButtonLabel(){
  const {totalSets, filledSets} = computeDayProgress();
  const btn = document.getElementById('saveBtn');
  if(filledSets===0){ btn.textContent = 'Save Workout'; return; }
  btn.textContent = filledSets>=totalSets ? `Save Workout · ${filledSets}/${totalSets} sets` : `Save Partial Workout · ${filledSets}/${totalSets}`;
}

/* ---------- Session duration tracking ---------- */
async function markSessionStart(){
  const key = 'session_start_'+currentDay+'_'+currentDate;
  const existing = await safeGet(key);
  if(!existing) await safeSet(key, Date.now());
}
async function updateDaySessionRecord(day, date, volume, duration){
  const key = 'day_sessions_'+day;
  let records = (await safeGet(key)) || [];
  const prevRecords = records.filter(r=>r.date!==date);
  const prevVolume = prevRecords.length ? prevRecords[prevRecords.length-1].volume : null;
  const filtered = records.filter(r=>r.date!==date);
  filtered.push({date, volume, duration});
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  await safeSet(key, filtered.slice(-30));
  return prevVolume;
}

/* ---------- Save ---------- */
async function saveSession(){
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  status.textContent = 'Saving...';

  const d = PLAN[currentDay];
  const cards = document.querySelectorAll('.exercise');
  let savedCount = 0;
  let anySaved = false;
  let totalVolume = 0;
  let totalPRs = 0;
  let exercisesCompleted = 0;

  for(const card of cards){
    const exId = card.dataset.exId;
    const exObj = d.exercises.find(e=>e.id===exId);
    const type = card.dataset.type;
    const done = card.querySelector('.ex-check').classList.contains('done');
    if(done) exercisesCompleted++;
    const rows = card.querySelectorAll('.set-row');
    const sets = [];

    rows.forEach(row=>{
      if(type==='time'){
        const sec = row.querySelector('.sec-input').value;
        if(sec !== '') sets.push({sec: Number(sec)});
      } else {
        const w = row.querySelector('.w-input').value;
        const r = row.querySelector('.r-input').value;
        if(w !== '' || r !== '') sets.push({w: w!=='' ? Number(w) : 0, r: r!=='' ? Number(r) : 0});
      }
    });

    if(sets.length === 0 && !done) continue;

    const hist = (await safeGet('hist_'+exId)) || [];
    const filtered = hist.filter(h=>h.date!==currentDate);
    const todayEntry = {date: currentDate, sets, done};
    const prsBefore = detectPRs(hist.filter(h=>h.date!==currentDate), todayEntry, type);
    totalPRs += prsBefore.length;
    filtered.push(todayEntry);
    filtered.sort((a,b)=>a.date.localeCompare(b.date));
    const capped = filtered.slice(-15);
    await safeSet('hist_'+exId, capped);
    savedCount++;
    if(sets.length){
      anySaved = true;
      if(type!=='time' && !NON_LOAD_VOLUME.has(exId)) totalVolume += computeVolume(todayEntry);
    }
  }

  if(anySaved){
    const trained = new Set((await safeGet('trained_dates')) || []);
    trained.add(currentDate);
    await safeSet('trained_dates', Array.from(trained).sort().slice(-90));
    renderHeatmap();
    renderRecovery();
  }

  // duration
  const startTs = await safeGet('session_start_'+currentDay+'_'+currentDate);
  const durationMs = startTs ? (Date.now() - startTs) : null;
  const prevVolume = await updateDaySessionRecord(currentDay, currentDate, totalVolume, durationMs);

  btn.disabled = false;
  status.textContent = savedCount ? `Saved ✓ (${savedCount})` : 'Nothing to save';
  setTimeout(()=>{ status.textContent=''; }, 2500);

  if(anySaved){
    const allDone = exercisesCompleted >= d.exercises.length;
    showCompletionModal({
      allDone, totalVolume, prevVolume, durationMs, totalPRs, savedCount,
      totalPlannedSets: d.exercises.reduce((a,e)=>a+e.sets,0)
    });
  }

  renderDay();
}

function showCompletionModal(summary){
  const durMin = summary.durationMs ? Math.round(summary.durationMs/60000) : null;
  const volChangeText = (summary.prevVolume && summary.prevVolume>0 && summary.totalVolume>0)
    ? `${summary.totalVolume>=summary.prevVolume?'+':''}${Math.round(((summary.totalVolume-summary.prevVolume)/summary.prevVolume)*100)}% vs last time`
    : 'No prior session to compare';
  const nextIdx = (DAY_ORDER.indexOf(currentDay)+1) % DAY_ORDER.length;
  const nextDay = PLAN[DAY_ORDER[nextIdx]];
  const nextPrefix = nextDay.restBefore ? 'Rest day next, then' : 'Next workout:';

  document.querySelector('#completionModal .modal-title').textContent = summary.allDone ? 'Workout Complete' : 'Partial Workout Saved';
  document.getElementById('completionModalBody').innerHTML = `
    <div class="completion-stat-grid">
      <div class="completion-stat"><div class="val">${summary.savedCount}</div><div class="lbl">Exercises Logged</div></div>
      <div class="completion-stat"><div class="val">${durMin!==null ? durMin+'m' : '—'}</div><div class="lbl">Duration</div></div>
      <div class="completion-stat"><div class="val">${Math.round(summary.totalVolume)}</div><div class="lbl">Volume (kg)</div></div>
      <div class="completion-stat"><div class="val">${summary.totalPRs}</div><div class="lbl">PRs Hit</div></div>
    </div>
    <div class="info-text">${volChangeText}</div>
    <div class="completion-next">${nextPrefix} <b>${nextDay.label} — ${nextDay.title}</b></div>
  `;
  document.getElementById('completionModal').classList.add('open');
}
document.getElementById('completionModalClose').onclick = ()=> document.getElementById('completionModal').classList.remove('open');
document.getElementById('completionOkBtn').onclick = ()=> document.getElementById('completionModal').classList.remove('open');
document.getElementById('completionModal').addEventListener('click', (e)=>{ if(e.target.id==='completionModal') e.currentTarget.classList.remove('open'); });

/* ---------- CSV export ---------- */
async function exportCSV(){
  const keys = await safeList('hist_');
  const rows = [['day','workout','exercise','date','set','weight_kg','reps','seconds','done']];
  for(const key of keys){
    const exId = key.replace('hist_','');
    const meta = EX_INDEX[exId];
    if(!meta) continue;
    const hist = (await safeGet(key)) || [];
    hist.forEach(entry=>{
      entry.sets.forEach((s,i)=>{
        rows.push([
          meta.day, meta.dayTitle, meta.name, entry.date, i+1,
          s.w !== undefined ? s.w : '',
          s.r !== undefined ? s.r : '',
          s.sec !== undefined ? s.sec : '',
          entry.done ? 'yes' : 'no'
        ]);
      });
      if(entry.sets.length===0 && entry.done){
        rows.push([meta.day, meta.dayTitle, meta.name, entry.date, '', '', '', '', 'yes']);
      }
    });
  }
  const bwLog = (await safeGet('bodyweight_log')) || [];
  rows.push([]);
  rows.push(['bodyweight_log']);
  rows.push(['date','weight_kg']);
  bwLog.forEach(e=>rows.push([e.date, e.weight]));
  const waistLog = (await safeGet('waist_log')) || [];
  rows.push([]);
  rows.push(['waist_log']);
  rows.push(['date','waist_cm']);
  waistLog.forEach(e=>rows.push([e.date, e.waist]));

  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `iron_log_export_${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('logDate').value = currentDate;
document.getElementById('logDate').addEventListener('change', (e)=>{
  currentDate = e.target.value;
  renderDay();
});
document.getElementById('saveBtn').addEventListener('click', saveSession);
document.getElementById('bwLogBtn').addEventListener('click', logBodyweight);
document.getElementById('waistLogBtn').addEventListener('click', logWaist);
document.getElementById('exportBtn').addEventListener('click', exportCSV);

renderTabs();
renderDay();
renderBodyweight();
renderWaist();
renderHeatmap();
renderRecovery();
</script>
